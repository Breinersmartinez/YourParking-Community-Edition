# ============================================================
#  Configuración de Prometheus
#  Scrapea las métricas del backend Spring Boot (Actuator)
#  y su propio estado interno.
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas del backend (Spring Boot Actuator + Micrometer)
  - job_name: "spring-boot-backend"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: "parking-management-api"

  # Auto-scrape de Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Graphite expone métricas internas por HTTP en el puerto 8088
  # dentro de la imagen oficial (opcional, ignora errores si no responde)
  - job_name: "graphite"
    static_configs:
      - targets: ["graphite:8080"]
