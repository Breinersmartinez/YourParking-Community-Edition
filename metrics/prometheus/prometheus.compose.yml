# =====================================================================
#  YourParking - Configuración de Prometheus (para el docker-compose raíz).
#  Los servicios corren en la red "yp-net": el backend se alcanza como
#  "backend:8080". Usa metrics/prometheus/prometheus.yml si el backend
#  corre fuera de contenedores (host.docker.internal).
# =====================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerting-rules.yml"

scrape_configs:
  - job_name: "yourparking-backend"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "backend:8080"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"