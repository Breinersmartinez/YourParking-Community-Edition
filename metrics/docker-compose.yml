# =====================================================================
#  YourParking - Stack de observabilidad
#  Prometheus + Grafana para visualizar las métricas del backend.
# =====================================================================
#
# Uso:
#   docker compose -f metrics/docker-compose.yml up -d
#
# Servicios expuestos:
#   - Prometheus UI : http://localhost:9090
#   - Grafana       : http://localhost:3000  (admin / admin)
#
# El backend que se desea monitorear se conecta a la red "metros"
# con un alias de host "backend". Ajusta prometheus/prometheus.yml
# si tu instancia del backend usa otro nombre o IP.
#
# Nota: los volúmenes nombrados conservan los datos entre reinicios.
# =====================================================================

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: yp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - metros

  grafana:
    image: grafana/grafana:11.1.0
    container_name: yp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - metros

volumes:
  prometheus-data:
  grafana-data:

networks:
  metros:
    # Permite que el backend (si se levanta en este compose) se una a la red.
    # Para monitorear un backend externo, comenta la siguiente línea.
    driver: bridge
