server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de Vite: caché larga e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # el index.html nunca debe cachearse (para que los deploys entiendan rápido)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # App SPA (HashRouter: todas las rutas caen en index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}