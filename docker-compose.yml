# ============================================================
#  YourParking - Community Edition
#  Stack: Backend + PostgreSQL + Prometheus + Grafana + Graphite
#
#  Uso:
#    cp .env.example .env   (y completa los valores)
#    docker compose up -d --build
#
#  Servicios:
#    Backend     -> http://localhost:8080
#    Swagger     -> http://localhost:8080/swagger-ui.html
#    Prometheus  -> http://localhost:9090
#    Grafana     -> http://localhost:3000 (admin / ${GRAFANA_ADMIN_PASSWORD})
#    Graphite UI -> http://localhost:8282
# ============================================================

name: yourparking

services:
  # ------------------------- Base de datos -------------------------
  db:
    image: postgres:16-alpine
    container_name: parking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/parking_management.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ---------------------------- Backend ----------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parking-backend
    restart: unless-stopped
    environment:
      URL_DB: jdbc:postgresql://db:5432/${POSTGRES_DB}
      USER_NAME: ${POSTGRES_USER}
      PASSWORD_DB: ${POSTGRES_PASSWORD}
      TOKEN_JWT: ${TOKEN_JWT}
      USER_NAME_MAIL: ${USER_NAME_MAIL}
      APP_PASSWORD: ${APP_PASSWORD}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    entrypoint: ["sh", "-c", "java $$JAVA_OPTS -jar app.jar"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-net

  # --------------------------- Prometheus --------------------------
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: parking-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-net

  # --------------------------- Graphite ----------------------------
  # Almacén de series temporales (carbon) + UI propia.
  # Prometheus puede hacer remote_write hacia carbon (puerto 2003).
  graphite:
    image: graphiteapp/graphite-statsd:1.1.10-14.2
    container_name: parking-graphite
    restart: unless-stopped
    volumes:
      - graphite-data:/opt/graphite/storage
    ports:
      - "8282:80"      # Interfaz web de Graphite
      - "2003:2003"    # Carbon line protocol
      - "2004:2004"    # Carbon pickle protocol
      - "8125:8125/udp" # StatsD UDP
      - "8126:8126"    # StatsD TCP
    networks:
      - app-net

  # ---------------------------- Grafana ----------------------------
  grafana:
    image: grafana/grafana:11.6.1
    container_name: parking-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - graphite
    networks:
      - app-net

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  graphite-data:

networks:
  app-net:
    driver: bridge
