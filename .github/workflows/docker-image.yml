name: CD — Imágenes Docker

# Entrega continua: construye y publica en GHCR las imágenes del backend
# y del frontend. Incluye SBOM/provenance, escaneo de vulnerabilidades
# (Trivy) y firma con cosign (keyless, OIDC).
#
#   - push a main        -> etiqueta "latest"  (¡no tag semver: a tu criterio)
#   - push a develop     -> etiqueta "develop"
#   - tags v*            -> etiquetas semver (v1.2.3, v1.2, v1, latest)
#   - pull_request       -> build de verificación SIN publicar
#   - workflow_dispatch  -> manual

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # firma de imágenes con cosign (OIDC)
  attestations: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Imagen ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            file: ./backend/Dockerfile
          - component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            # build-arg del frontend; en producción apunta al desplegado.
            # Si tu CI despliega el stack completo, es "http://localhost:8080".
            build_arg: VITE_API_URL=http://localhost:8080
    outputs:
      image: ${{ env.REGISTRY_IMAGE }}/${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Metadata de la imagen (tags y labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}/${{ matrix.component }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_arg }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true # SLSA provenance en la imagen
          sbom: true       # SBOM generado por BuildKit

      # Escaneo de vulnerabilidades sobre la imagen construida.
      # En los builds de verificación (PR) se escanea el filesystem.
      - name: Escaneo Trivy (imagen publicada)
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY_IMAGE }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m

      - name: Escaneo Trivy (filesystem, en PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.context }}
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Subir resultados Trivy al Code Scanning (imagen)
        if: github.event_name != 'pull_request' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: trivy-image.sarif

      - name: Subir resultados Trivy al Code Scanning (filesystem)
        if: github.event_name == 'pull_request' && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Firma cosign (keyless con OIDC)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: cosign obtiene el OIDC token de forma ambiente
      # gracias al permiso "id-token: write" de este workflow.
      - name: Firmar la imagen con cosign
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        run: |
          IMAGE="${{ env.REGISTRY_IMAGE }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "$IMAGE"